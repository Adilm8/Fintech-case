[project]
name = "backend"
version = "0.1.0"
description = "BCC Business Shield backend API"
readme = "README.md"
authors = [
    { name = "Adil", email = "adtsco00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
